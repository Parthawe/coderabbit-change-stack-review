gn and working prototype</figcaption><img src="prototype.png?v=brand-20261019" alt="Light review workspace with nested file navigation, one file toolbar, unified diff, and a selected summary linked to highlighted code."></figure></div><script>document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#comparison').classList.toggle('single',v!=='both');document.querySelectorAll('figure').forEach(f=>f.classList.toggle('visible',f.id===v))}));</script></body></html>
